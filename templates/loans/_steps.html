<ol class="stepper" aria-label="Progreso">
  {% for s in steps %}<li class="{{ s.state }}"{% if s.state == 'current' %} aria-current="step"{% endif %}><span>{% if s.state == 'done' %}✓{% else %}{{ s.n }}{% endif %}</span>{{ s.label }}<span class="sr-only">{% if s.state == 'done' %} (completado){% elif s.state == 'current' %} (actual){% endif %}</span></li>{% endfor %}
</ol>
