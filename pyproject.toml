[project]
name = "nextpoint"
version = "1.0.0"
requires-python = ">=3.12"
# Mantener sincronizado con requirements.txt
dependencies = [
    "Django==5.2.19",
    "dj-database-url==3.1.2",
    "whitenoise==6.12.0",
    "psycopg[binary]==3.3.9",
]

[tool.vercel.scripts]
# Se ejecuta en cada despliegue: aplica migraciones y carga los datos demo (idempotente).
build = "python manage.py deploy_prepare"
